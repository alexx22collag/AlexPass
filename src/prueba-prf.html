<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Prueba Face ID</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="cabecera"><h1>Prueba Face ID (PRF)</h1></header>
<main>
<section class="tarjeta">
<p>Página de <strong>prueba temporal</strong>, no forma parte de AlexPass y no guarda ni envía datos. Comprueba si este dispositivo puede dar un secreto propio con Face ID (extensión PRF de WebAuthn). Sigue los pasos en orden.</p>
<div class="fila-botones"><button type="button" class="primario" id="p1">1. Comprobar soporte</button></div>
<div class="fila-botones"><button type="button" id="p2">2. Crear passkey de prueba</button></div>
<div class="fila-botones"><button type="button" id="p3">3. Pedir secreto con Face ID</button></div>
<div class="fila-botones"><button type="button" id="p4">4. Repetir el paso 3 (debe dar lo mismo)</button></div>
</section>
<section class="tarjeta"><h2>Resultado</h2><pre id="log" style="white-space:pre-wrap;word-break:break-word"></pre></section>
</main>
<script type="module" src="prueba-prf.js"></script>
</body>
</html>
